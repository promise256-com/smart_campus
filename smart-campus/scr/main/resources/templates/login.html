<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login · Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 440px; margin-top: 80px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="text-center mb-1">Smart Campus</h4>
            <p class="text-center text-muted small mb-4">
                Student Management &amp; Academic Information System
            </p>

            <div th:if="${param.error}" class="alert alert-danger py-2">Invalid username or password.</div>
            <div th:if="${param.logout}" class="alert alert-success py-2">You have been logged out.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button class="btn btn-primary w-100">Sign in</button>
            </form>

            <hr>
            <p class="small text-muted mb-0">
                Demo accounts:<br>
                admin / admin123 &nbsp;·&nbsp; lecturer / lect123 &nbsp;·&nbsp; student / stud123
            </p>
        </div>
    </div>
</div>
</body>
</html>
