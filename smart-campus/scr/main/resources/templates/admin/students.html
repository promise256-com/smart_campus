<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students · Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">Smart Campus · Admin</span>
    <div>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-light btn-sm">Dashboard</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <h3>Students</h3>

    <div th:if="${param.added}" class="alert alert-success py-2">Student registered successfully.</div>
    <div th:if="${param.userExists}" class="alert alert-danger py-2">Username already taken.</div>

    <div class="card mb-4">
        <div class="card-header">Register New Student</div>
        <div class="card-body">
            <form th:action="@{/admin/students/add}" method="post" class="row g-2">
                <div class="col-md-3"><input name="studentNo" class="form-control" placeholder="Student No" required></div>
                <div class="col-md-3"><input name="firstName" class="form-control" placeholder="First Name" required></div>
                <div class="col-md-3"><input name="lastName" class="form-control" placeholder="Last Name" required></div>
                <div class="col-md-3"><input name="email" type="email" class="form-control" placeholder="Email"></div>
                <div class="col-md-3"><input name="phone" class="form-control" placeholder="Phone"></div>
                <div class="col-md-3"><input name="yearOfStudy" type="number" min="1" max="6" value="1" class="form-control" placeholder="Year"></div>
                <div class="col-md-3">
                    <select name="programId" class="form-select" required>
                        <option value="">-- Program --</option>
                        <option th:each="p : ${programs}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>
                <div class="col-md-3"><input name="username" class="form-control" placeholder="Login Username" required></div>
                <div class="col-md-3"><input name="password" type="password" class="form-control" placeholder="Login Password" required></div>
                <div class="col-md-3"><button class="btn btn-primary w-100">Save Student</button></div>
            </form>
        </div>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr><th>#</th><th>Student No</th><th>Name</th><th>Email</th><th>Program</th><th>Year</th></tr>
        </thead>
        <tbody>
        <tr th:each="s, it : ${students}">
            <td th:text="${it.count}"></td>
            <td th:text="${s.studentNo}"></td>
            <td th:text="${s.fullName}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.program != null ? s.program.name : '-'}"></td>
            <td th:text="${s.yearOfStudy}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}"><td colspan="6" class="text-center text-muted">No students yet.</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
