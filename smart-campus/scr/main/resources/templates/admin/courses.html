<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Courses · Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">Smart Campus · Admin</span>
    <div>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-light btn-sm">Dashboard</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <h3>Courses</h3>

    <div th:if="${param.added}" class="alert alert-success py-2">Course created successfully.</div>

    <div class="card mb-4">
        <div class="card-header">Add New Course</div>
        <div class="card-body">
            <form th:action="@{/admin/courses/add}" method="post" class="row g-2">
                <div class="col-md-2"><input name="code" class="form-control" placeholder="Code" required></div>
                <div class="col-md-4"><input name="title" class="form-control" placeholder="Course Title" required></div>
                <div class="col-md-2"><input name="creditUnits" type="number" min="1" max="10" value="3" class="form-control"></div>
                <div class="col-md-2"><input name="semester" type="number" min="1" max="3" value="1" class="form-control"></div>
                <div class="col-md-2"><input name="academicYear" class="form-control" value="2025/2026"></div>
                <div class="col-md-5">
                    <select name="programId" class="form-select" required>
                        <option value="">-- Program --</option>
                        <option th:each="p : ${programs}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>
                <div class="col-md-5">
                    <select name="lecturerId" class="form-select">
                        <option value="">-- Assign Lecturer (optional) --</option>
                        <option th:each="l : ${lecturers}" th:value="${l.id}" th:text="${l.fullName}"></option>
                    </select>
                </div>
                <div class="col-md-2"><button class="btn btn-primary w-100">Save</button></div>
            </form>
        </div>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr><th>Code</th><th>Title</th><th>CU</th><th>Sem</th><th>Year</th><th>Program</th><th>Lecturer</th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${courses}">
            <td th:text="${c.code}"></td>
            <td th:text="${c.title}"></td>
            <td th:text="${c.creditUnits}"></td>
            <td th:text="${c.semester}"></td>
            <td th:text="${c.academicYear}"></td>
            <td th:text="${c.program != null ? c.program.name : '-'}"></td>
            <td th:text="${c.lecturer != null ? c.lecturer.fullName : 'Unassigned'}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(courses)}"><td colspan="7" class="text-center text-muted">No courses yet.</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
