<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard · Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">Smart Campus · Admin</span>
    <form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm">Logout</button></form>
</nav>

<div class="container mt-4">
    <h3>Dashboard</h3>

    <div class="row g-3 mt-2">
        <div class="col-md-3">
            <div class="card text-bg-primary"><div class="card-body">
                <h6>Students</h6><h2 th:text="${studentCount}">0</h2>
            </div></div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-success"><div class="card-body">
                <h6>Lecturers</h6><h2 th:text="${lecturerCount}">0</h2>
            </div></div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-warning"><div class="card-body">
                <h6>Programs</h6><h2 th:text="${programCount}">0</h2>
            </div></div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-info"><div class="card-body">
                <h6>Courses</h6><h2 th:text="${courseCount}">0</h2>
            </div></div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/admin/students}" class="btn btn-outline-primary">Manage Students</a>
        <a th:href="@{/admin/courses}" class="btn btn-outline-primary">Manage Courses</a>
    </div>
</div>
</body>
</html>
