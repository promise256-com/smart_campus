<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard · Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand mb-0 h1">Smart Campus · Student</span>
    <div>
        <a th:href="@{/student/courses}" class="btn btn-outline-light btn-sm">Courses</a>
        <a th:href="@{/student/attendance}" class="btn btn-outline-light btn-sm">Attendance</a>
        <a th:href="@{/student/results}" class="btn btn-outline-light btn-sm">Results</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <h3>Welcome, <span th:text="${student.fullName}"></span></h3>

    <div class="row mt-3">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">My Profile</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Student No: <b th:text="${student.studentNo}"></b></li>
                    <li class="list-group-item">Program: <b th:text="${student.program != null ? student.program.name : '-'}"></b></li>
                    <li class="list-group-item">Year of Study: <b th:text="${student.yearOfStudy}"></b></li>
                    <li class="list-group-item">Email: <b th:text="${student.email}"></b></li>
                </ul>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card text-bg-info h-100">
                <div class="card-body text-center d-flex flex-column justify-content-center">
                    <h6>Current GPA</h6>
                    <h1 th:text="${gpa}">0.00</h1>
                    <small>Credit-weighted grade point average</small>
                </div>
            </div>
        </div>
    </div>

    <h5 class="mt-4">Registered Courses</h5>
    <table class="table table-striped table-bordered">
        <thead class="table-dark"><tr><th>Code</th><th>Title</th><th>CU</th><th>Lecturer</th></tr></thead>
        <tbody>
        <tr th:each="e : ${enrollments}">
            <td th:text="${e.course.code}"></td>
            <td th:text="${e.course.title}"></td>
            <td th:text="${e.course.creditUnits}"></td>
            <td th:text="${e.course.lecturer != null ? e.course.lecturer.fullName : 'TBA'}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(enrollments)}">
            <td colspan="4" class="text-center text-muted">You have not registered for any course yet.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
