<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Results · Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>@media print { .no-print { display: none; } }</style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary px-3 no-print">
    <span class="navbar-brand mb-0 h1">Smart Campus · Student</span>
    <div>
        <a th:href="@{/student/dashboard}" class="btn btn-outline-light btn-sm">Dashboard</a>
        <button onclick="window.print()" class="btn btn-outline-light btn-sm">Print Transcript</button>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <h3>Academic Transcript</h3>
    <p>
        <b th:text="${student.fullName}"></b> ·
        <span th:text="${student.studentNo}"></span> ·
        <span th:text="${student.program != null ? student.program.name : '-'}"></span>
    </p>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr><th>Code</th><th>Course</th><th>CU</th><th>Coursework</th><th>Exam</th><th>Total</th><th>Grade</th><th>Points</th></tr>
        </thead>
        <tbody>
        <tr th:each="m : ${marks}">
            <td th:text="${m.enrollment.course.code}"></td>
            <td th:text="${m.enrollment.course.title}"></td>
            <td th:text="${m.enrollment.course.creditUnits}"></td>
            <td th:text="${m.coursework}"></td>
            <td th:text="${m.exam}"></td>
            <td th:text="${m.total}"></td>
            <td th:text="${m.grade}"></td>
            <td th:text="${m.gradePoint}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(marks)}"><td colspan="8" class="text-center text-muted">No results published yet.</td></tr>
        </tbody>
        <tfoot>
        <tr class="table-secondary">
            <th colspan="7" class="text-end">GPA</th>
            <th th:text="${gpa}"></th>
        </tr>
        </tfoot>
    </table>
</div>
</body>
</html>
