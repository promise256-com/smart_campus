<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Course Registration · Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand mb-0 h1">Smart Campus · Student</span>
    <div>
        <a th:href="@{/student/dashboard}" class="btn btn-outline-light btn-sm">Dashboard</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <h3>Course Registration</h3>

    <div th:if="${param.registered}" class="alert alert-success py-2">Course registered successfully.</div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr><th>Code</th><th>Title</th><th>CU</th><th>Semester</th><th>Lecturer</th><th>Action</th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${courses}">
            <td th:text="${c.code}"></td>
            <td th:text="${c.title}"></td>
            <td th:text="${c.creditUnits}"></td>
            <td th:text="${c.semester}"></td>
            <td th:text="${c.lecturer != null ? c.lecturer.fullName : 'TBA'}"></td>
            <td>
                <form th:action="@{/student/courses/register}" method="post" class="d-inline">
                    <input type="hidden" name="courseId" th:value="${c.id}">
                    <button class="btn btn-sm btn-primary"
                            th:disabled="${#lists.contains(enrollments.![course.id], c.id)}"
                            th:text="${#lists.contains(enrollments.![course.id], c.id)} ? 'Registered' : 'Register'">
                        Register
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
