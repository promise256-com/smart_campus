<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Attendance · Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand mb-0 h1">Smart Campus · Student</span>
    <div>
        <a th:href="@{/student/dashboard}" class="btn btn-outline-light btn-sm">Dashboard</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <h3>My Attendance</h3>

    <table class="table table-striped table-bordered">
        <thead class="table-dark"><tr><th>Date</th><th>Course</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="r : ${records}">
            <td th:text="${#temporals.format(r.date,'dd MMM yyyy')}"></td>
            <td th:text="${r.enrollment.course.code} + ' - ' + ${r.enrollment.course.title}"></td>
            <td>
                <span class="badge"
                      th:classappend="${r.status.name() == 'PRESENT'} ? 'text-bg-success'
                                    : (${r.status.name() == 'ABSENT'} ? 'text-bg-danger' : 'text-bg-warning')"
                      th:text="${r.status}"></span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(records)}"><td colspan="3" class="text-center text-muted">No attendance records yet.</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
