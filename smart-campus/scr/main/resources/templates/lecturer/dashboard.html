<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lecturer Dashboard · Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-success px-3">
    <span class="navbar-brand mb-0 h1">Smart Campus · Lecturer</span>
    <form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm">Logout</button></form>
</nav>

<div class="container mt-4">
    <h3>Welcome, <span th:text="${lecturer.fullName}"></span></h3>
    <p class="text-muted">
        Staff No: <span th:text="${lecturer.staffNo}"></span> ·
        Department: <span th:text="${lecturer.department != null ? lecturer.department.name : '-'}"></span>
    </p>

    <h5 class="mt-4">My Assigned Courses</h5>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr><th>Code</th><th>Title</th><th>CU</th><th>Semester</th><th>Enrolled</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${courses}">
            <td th:text="${c.code}"></td>
            <td th:text="${c.title}"></td>
            <td th:text="${c.creditUnits}"></td>
            <td th:text="${c.semester}"></td>
            <td th:text="${counts[c.id]}"></td>
            <td>
                <a th:href="@{'/lecturer/attendance/' + ${c.id}}" class="btn btn-sm btn-outline-primary">Attendance</a>
                <a th:href="@{'/lecturer/marks/' + ${c.id}}" class="btn btn-sm btn-outline-success">Marks</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(courses)}"><td colspan="6" class="text-center text-muted">No courses assigned.</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
