<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Attendance · Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-success px-3">
    <span class="navbar-brand mb-0 h1">Smart Campus · Lecturer</span>
    <div>
        <a th:href="@{/lecturer/dashboard}" class="btn btn-outline-light btn-sm">Dashboard</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <h3>Attendance — <span th:text="${course.code}"></span> <span th:text="${course.title}"></span></h3>

    <div th:if="${param.saved}" class="alert alert-success py-2">Attendance saved.</div>

    <form th:action="@{'/lecturer/attendance/' + ${course.id}}" method="post">
        <div class="row mb-3">
            <div class="col-md-3">
                <label class="form-label">Date</label>
                <input type="date" name="date" class="form-control" th:value="${today}" required>
            </div>
        </div>

        <table class="table table-bordered">
            <thead class="table-dark">
            <tr><th>#</th><th>Student No</th><th>Name</th><th>Status</th><th>Previous Records</th></tr>
            </thead>
            <tbody>
            <tr th:each="e, it : ${enrollments}">
                <td th:text="${it.count}"></td>
                <td th:text="${e.student.studentNo}"></td>
                <td th:text="${e.student.fullName}"></td>
                <td>
                    <div class="btn-group" role="group">
                        <input type="radio" class="btn-check" th:name="'status_' + ${e.id}" th:id="'p' + ${e.id}" value="PRESENT" checked>
                        <label class="btn btn-outline-success btn-sm" th:for="'p' + ${e.id}">Present</label>

                        <input type="radio" class="btn-check" th:name="'status_' + ${e.id}" th:id="'a' + ${e.id}" value="ABSENT">
                        <label class="btn btn-outline-danger btn-sm" th:for="'a' + ${e.id}">Absent</label>

                        <input type="radio" class="btn-check" th:name="'status_' + ${e.id}" th:id="'l' + ${e.id}" value="LATE">
                        <label class="btn btn-outline-warning btn-sm" th:for="'l' + ${e.id}">Late</label>
                    </div>
                </td>
                <td>
                    <span class="badge text-bg-secondary me-1"
                          th:each="r : ${history[e.id]}"
                          th:text="${#temporals.format(r.date,'dd/MM')} + ' ' + ${r.status}"></span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(enrollments)}"><td colspan="5" class="text-center text-muted">No students registered.</td></tr>
            </tbody>
        </table>

        <button class="btn btn-success" th:disabled="${#lists.isEmpty(enrollments)}">Save Attendance</button>
    </form>
</div>
</body>
</html>
