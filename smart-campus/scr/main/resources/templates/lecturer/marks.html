<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Marks · Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-success px-3">
    <span class="navbar-brand mb-0 h1">Smart Campus · Lecturer</span>
    <div>
        <a th:href="@{/lecturer/dashboard}" class="btn btn-outline-light btn-sm">Dashboard</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <h3>Marks — <span th:text="${course.code}"></span> <span th:text="${course.title}"></span></h3>
    <p class="text-muted">Coursework is out of 40, Exam is out of 60. Total and grade are calculated automatically.</p>

    <div th:if="${param.saved}" class="alert alert-success py-2">Marks saved and grades computed.</div>

    <form th:action="@{'/lecturer/marks/' + ${course.id}}" method="post">
        <table class="table table-bordered">
            <thead class="table-dark">
            <tr><th>#</th><th>Student No</th><th>Name</th><th>Coursework /40</th><th>Exam /60</th><th>Total</th><th>Grade</th></tr>
            </thead>
            <tbody>
            <tr th:each="e, it : ${enrollments}">
                <td th:text="${it.count}"></td>
                <td th:text="${e.student.studentNo}"></td>
                <td th:text="${e.student.fullName}"></td>
                <td>
                    <input type="number" step="0.5" min="0" max="40" class="form-control form-control-sm"
                           th:name="'coursework_' + ${e.id}"
                           th:value="${marks[e.id] != null ? marks[e.id].coursework : ''}">
                </td>
                <td>
                    <input type="number" step="0.5" min="0" max="60" class="form-control form-control-sm"
                           th:name="'exam_' + ${e.id}"
                           th:value="${marks[e.id] != null ? marks[e.id].exam : ''}">
                </td>
                <td th:text="${marks[e.id] != null ? marks[e.id].total : '-'}"></td>
                <td th:text="${marks[e.id] != null ? marks[e.id].grade : '-'}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(enrollments)}"><td colspan="7" class="text-center text-muted">No students registered.</td></tr>
            </tbody>
        </table>

        <button class="btn btn-success" th:disabled="${#lists.isEmpty(enrollments)}">Save Marks</button>
    </form>
</div>
</body>
</html>
